name: Repository quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    name: Code and data policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Reject tracked datasets and generated outputs
        run: python scripts/check_repository.py --history
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Lint, types, security, synthetic tests and dependency checks
        run: python check_quality.py
  training-cpu:
    name: PyTorch CPU regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install base and CPU training dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip check
      - name: Require PyTorch import and run CPU regression
        run: |
          python -c "import torch; print(torch.__version__)"
          python -m pytest -q -rs tests/test_dl_training.py -m 'not cuda'
